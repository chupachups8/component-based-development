server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                allowCredentials: true

          routes:
            - id: movie-service
              uri: lb://movie-service
              predicates:
                - Path=/movies/**,/auditoriums/**,/screenings/**

            - id: reservation-service
              uri: lb://reservation-service
              predicates:
                - Path=/customers/**,/reservations/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/payments/**

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/